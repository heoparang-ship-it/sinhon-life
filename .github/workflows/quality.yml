name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sinhon_os
          POSTGRES_PASSWORD: sinhon_os
          POSTGRES_USER: sinhon_os
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432
    env:
      AUTH_TOKEN_SECRET: ci-only-change-me
      DATABASE_URL: postgresql://sinhon_os:sinhon_os@localhost:5433/sinhon_os?schema=public
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000/api/v1
      NEXT_PUBLIC_WEB_BASE_URL: http://localhost:3002
      PII_ENCRYPTION_KEY: ci-only-32-byte-minimum-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:push
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

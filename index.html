  <script>
  // Old CloudFront PWA installed a Service Worker on visitors' browsers that
  // still serves stale cached HTML. Detect, kill it, clear caches, reload.
  (function () {
    if (!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      if (!regs.length) return;
      var work = regs.map(function (r) { return r.unregister(); });
      if (window.caches) {
        work.push(caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }));
      }
      Promise.all(work).then(function () {
        if (!sessionStorage.getItem('__sw_killed')) {
          sessionStorage.setItem('__sw_killed', '1');
          location.reload();
        }
      });
    }).catch(function () {});
  })();
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>

  <script type="text/babel" data-presets="env,react">

// ─── 디자인 토큰 ──────────────────────────────────────────────
const T = {
  blue:        '#6FB1EA',
  blueDeep:    '#5A9DD8',
  blueSoft:    '#88C0EE',
  blueDeepest: '#3B8BCF',
  onBlue:      '#FFFFFF',
  onBlueMute:  'rgba(255,255,255,0.72)',
  onBlueFaint: 'rgba(255,255,255,0.55)',
  glass:       'rgba(255,255,255,0.20)',
  white:       '#FFFFFF',
  paper:       '#F4F8FC',
  surface:     '#EAF3FB',
  hairline:    '#E2EBF3',
  ink:         '#1A2433',
  inkSoft:     '#3A4A5E',
  mute:        '#7A8696',
  faint:       '#B5BDC8',
  accentDeep:  '#3B8BCF',
  expense:     '#D97E6A',

const G = {

  pillIdleOnWhite:   'linear-gradient(90deg, #E6F0FA 0%, #EEF5FC 60%, #F2F7FC 100%)',
  pillActiveOnBlue:  'linear-gradient(90deg, #FFFFFF 0%, #FAFCFE 60%, #F0F6FC 100%)',

// ─── 내비게이션 컨텍스트 ────────────────────────────────────────
const NavCtx = React.createContext(null);
function useNav() { return React.useContext(NavCtx); }

// ─── 프리미티브 ────────────────────────────────────────────────
function MicroLabel({ children, color, style }) {
  return (
    <span style={{
      fontFamily: T.font, fontSize: 11, fontWeight: 600,
      letterSpacing: '0.04em', color: color || T.faint,
      textTransform: 'uppercase', ...style,
    }}>{children}</span>
  );
}

function Pill({ children, active, onWhite, style, size = 36, onClick }) {
  const base = onWhite
    ? { background: active ? G.pillActiveOnWhite : G.pillIdleOnWhite, color: active ? '#FFFFFF' : T.accentDeep }
    : {
        background: active ? G.pillActiveOnBlue : T.glass,
        color: active ? T.ink : T.onBlue,
        backdropFilter: active ? 'none' : 'blur(8px)',
        WebkitBackdropFilter: active ? 'none' : 'blur(8px)',
        boxShadow: active ? '0 6px 18px -10px rgba(20,40,80,0.35)' : 'none',
      };
  return (
    <div onClick={onClick} style={{
      display: 'inline-flex', alignItems: 'center', height: size,
      padding: '0 16px', borderRadius: 999,
      fontSize: 13, fontWeight: 500, letterSpacing: '-0.01em',
      whiteSpace: 'nowrap', cursor: onClick ? 'pointer' : 'default',
      userSelect: 'none', WebkitUserSelect: 'none',
      ...base, ...style,
    }}>{children}</div>
  );
}

function GlassBubble({ size, top, left, right, bottom, opacity = 0.22, icon }) {
  return (
    <div style={{
      position: 'absolute', top, left, right, bottom,
      width: size, height: size, borderRadius: '50%',
      background: `radial-gradient(circle at 30% 25%, rgba(255,255,255,${opacity + 0.18}) 0%, rgba(255,255,255,${opacity}) 55%, rgba(255,255,255,${opacity * 0.4}) 100%)`,
      backdropFilter: 'blur(10px)', WebkitBackdropFilter: 'blur(10px)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      color: 'rgba(255,255,255,0.78)', pointerEvents: 'none',
    }}>{icon}</div>
  );
}

function CharacterBubble({ size = 108, label = '3D\ncharacter', style }) {
  return (
    <div style={{
      width: size, height: size, borderRadius: '50%',
      background: 'radial-gradient(circle at 30% 25%, rgba(255,255,255,0.72) 0%, rgba(255,255,255,0.32) 55%, rgba(255,255,255,0.14) 100%)',
      backdropFilter: 'blur(14px)', WebkitBackdropFilter: 'blur(14px)',
      boxShadow: '0 22px 40px -18px rgba(20,40,80,0.40), inset 0 1px 0 rgba(255,255,255,0.45)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      overflow: 'hidden', ...style,
    }}>
      <div style={{
        fontFamily: T.font, fontSize: 9.5, fontWeight: 600,
        letterSpacing: '0.08em', textTransform: 'uppercase',
        color: 'rgba(255,255,255,0.82)', textAlign: 'center', lineHeight: 1.5,
        whiteSpace: 'pre-line',

}

// ─── 탭 바 ─────────────────────────────────────────────────────
function TabIcon({ name, active }) {

    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <path d="M4 11l8-6 8 6v9a1 1 0 01-1 1h-4v-6h-6v6H5a1 1 0 01-1-1v-9z" stroke={c} strokeWidth={sw} strokeLinejoin="round"/>
    </svg>
  );
  if (name === 'search') return (
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <circle cx="11" cy="11" r="6.5" stroke={c} strokeWidth={sw}/>
      <path d="M16 16l4 4" stroke={c} strokeWidth={sw} strokeLinecap="round"/>
    </svg>
  );
  if (name === 'ledger') return (
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <rect x="4" y="5" width="16" height="15" rx="2.5" stroke={c} strokeWidth={sw}/>
      <path d="M8 10h8M8 14h5" stroke={c} strokeWidth={sw} strokeLinecap="round"/>
    </svg>
  );
  return (
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="9" r="3.5" stroke={c} strokeWidth={sw}/>
      <path d="M5 20c1.2-3.5 4-5 7-5s5.8 1.5 7 5" stroke={c} strokeWidth={sw} strokeLinecap="round"/>
    </svg>

}

function TabBar() {
  const nav = useNav();
  const items = [
    { key: 'home',   label: '아카이브' },
    { key: 'search', label: '검색' },
    { key: 'ledger', label: '가계부' },
    { key: 'my',     label: 'MY' },
  ];
  return (
    <div style={{
      position: 'absolute', left: 14, right: 14, bottom: 26,
      background: T.white, borderRadius: 26,
      padding: '12px 8px 10px',
      boxShadow: '0 18px 40px -14px rgba(20,40,80,0.22), 0 2px 6px rgba(20,40,80,0.05)',
      display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', zIndex: 30,
    }}>
      {items.map(it => {
        const active = it.key === nav.tab;
        return (
          <div key={it.key} onClick={() => nav.setTab(it.key)} style={{
            display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6,
            cursor: 'pointer', userSelect: 'none', WebkitUserSelect: 'none',

            <TabIcon name={it.key} active={active} />
            <div style={{
              fontSize: 10.5, fontWeight: active ? 600 : 500,
              color: active ? T.ink : 'rgba(26,36,51,0.40)',
              letterSpacing: '-0.01em',
            }}>{it.label}</div>
          </div>
        );
      })}
    </div>
  );
}

// ─── 비디오 카드 ───────────────────────────────────────────────
function VideoThumb({ label, imageUrl, isVideo }) {
  return (

      position: 'relative', width: '100%', aspectRatio: '9 / 16',
      borderRadius: 16, overflow: 'hidden', background: T.surface,
      boxShadow: '0 18px 40px -28px rgba(20,40,80,0.22)',
    }}>
      {/* 실제 IG 이미지 (있으면) */}
      {imageUrl && (
        <img
          src={imageUrl}
          alt={label}
          loading="lazy"
          referrerPolicy="no-referrer"
          onError={(e) => { e.currentTarget.style.display = 'none'; }}
          style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', display: 'block' }}
        />
      )}
      {/* fallback 패턴 (이미지 없을 때만) */}
      {!imageUrl && (
        <div style={{
          position: 'absolute', inset: 0,
          backgroundImage: 'repeating-linear-gradient(135deg, rgba(90,130,180,0.06) 0 1px, transparent 1px 16px)',
        }} />
      )}
      {/* 라벨 — 이미지 위면 어둡게 보호 */}
      <div style={{ position: 'absolute', top: 14, left: 16, zIndex: 2 }}>
        <span style={{
          fontFamily: T.font, fontSize: 10.5, fontWeight: 600,
          letterSpacing: '0.02em',
          color: imageUrl ? '#FFFFFF' : '#3B8BCF',
          opacity: imageUrl ? 0.95 : 0.65,
          textTransform: 'uppercase',
          textShadow: imageUrl ? '0 1px 4px rgba(0,0,0,0.45)' : 'none',
        }}>{label}</span>
      </div>
      {/* 재생 버튼 — 영상일 때만 표시 */}
      {isVideo && (
        <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 2, pointerEvents: 'none' }}>

              <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="0%">

        <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(to bottom, rgba(0,0,0,0.18) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.10) 100%)', pointerEvents: 'none' }}/>

}

// ─── 화면 껍데기 ───────────────────────────────────────────────

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">

// ═══ Worker API 클라이언트 ══════════════════════════════════════
const ARCHIVE_API = 'https://sinhon-life-api.999pr.workers.dev';

function useArchiveData() {
  const [items, setItems] = React.useState(null); // null = loading
  const [tags, setTags] = React.useState([]);
  const [error, setError] = React.useState(null);
  React.useEffect(() => {
    let cancelled = false;
    Promise.all([
      fetch(ARCHIVE_API + '/api/media?limit=24').then(r => { if (!r.ok) throw new Error('media ' + r.status); return r.json(); }),
      fetch(ARCHIVE_API + '/api/tags?limit=20').then(r => { if (!r.ok) throw new Error('tags ' + r.status); return r.json(); }),
    ]).then(([m, t]) => {
      if (cancelled) return;
      setItems(m.items || []);
      setTags(t.tags || []);
    }).catch(e => { if (!cancelled) setError(e.message); });
    return () => { cancelled = true; };
  }, []);
  return { items, tags, error };
}

function ArchiveTagRail({ tags, total, activeTag, onSelect }) {
  // tags = [{tag, count}], activeTag = string|null
  const allCount = total != null ? String(total) : '...';
  return (
    <div style={{ marginTop: 40 }}>
      <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', padding: '0 28px' }}>
        <MicroLabel>Popular Tags</MicroLabel>
        <span style={{ fontSize: 11, color: T.faint, letterSpacing: '-0.01em' }}>실시간</span>
      </div>
      <div style={{ marginTop: 16, display: 'flex', gap: 8, overflowX: 'auto', padding: '4px 28px 8px' }}>
        <Pill onWhite active={activeTag === null} onClick={() => onSelect(null)}>
          # 전체
          <span style={{ marginLeft: 10, opacity: 0.85, fontSize: 11, fontWeight: 400 }}>{allCount}</span>
        </Pill>
        {(tags || []).map((t) => (
          <Pill key={t.tag} onWhite active={activeTag === t.tag} onClick={() => onSelect(t.tag)}>
            # {t.tag}
            <span style={{ marginLeft: 10, opacity: 0.85, fontSize: 11, fontWeight: 400 }}>{t.count}</span>
          </Pill>
        ))}
      </div>
    </div>
  );
}

function ArchiveGrid({ items, activeTag, error }) {
  // items === null → 로딩, items === [] → 빈 상태, items.length > 0 → 카드
  const all = items || [];
  const filtered = activeTag ? all.filter(it => (it.tags || []).includes(activeTag)) : all;
  const total = filtered.length;
  const isCarousel = total >= 3; // 3개 이상이면 가로 스크롤

  const labelFor = (it) => {
    const tag0 = (it.tags && it.tags[0]) || '신혼생활';
    const type = (it.media_type === 'VIDEO' || it.media_type === 'REELS') ? 'reel' : 'post';
    return type + ' · ' + tag0;
  };
  const titleFor = (it) => {
    const c = (it.caption || '').replace(/\s+/g, ' ').trim();
    return c.length > 60 ? c.slice(0, 60) + '…' : (c || '@sinhon.life');
  };
  const tagsFor = (it) => ((it.tags || []).slice(0, 2).map(t => '#' + t));

  const openInsta = (it) => {
    if (it && it.permalink) window.open(it.permalink, '_blank', 'noopener,noreferrer');
  };

  return (
    <div style={{ padding: '44px 22px 180px' }}>
      <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', padding: '0 6px', marginBottom: 24, gap: 12 }}>
        <div style={{ minWidth: 0, flex: 1 }}>
          <MicroLabel>This Week</MicroLabel>

// ═══ 앱 루트 ═════════════════════════════════════════════════════
function App() {
  const [tab,      setTab]      = React.useState('home');
  const [detail,   setDetail]   = React.useState(null);
  const [loggedIn, setLoggedIn] = React.useState(false);

  const nav = {
    tab,
    setTab:      (t)    => { setDetail(null); setTab(t); },
    loggedIn,
    setLoggedIn: (v)    => setLoggedIn(v),
    pushDetail:  (card) => setDetail(card || {}),
    popDetail:   ()     => setDetail(null),
  };

  let Screen;
  if (detail !== null)   Screen = <VideoDetailScreen card={detail} />;
  else if (tab === 'home')   Screen = <ArchiveHomeScreen />;
  else if (tab === 'search') Screen = <SearchScreen />;
  else if (tab === 'ledger') Screen = loggedIn ? <LedgerScreen /> : <LedgerGateScreen />;
  else                       Screen = <MyScreen />;

  return (
    <NavCtx.Provider value={nav}>
      <div className="layout">
        {/* 왼쪽: 폰 목업 + QR (데스크톱만) */}
        <LandingLeft />

        {/* 오른쪽: 앱 */}
        <div className="app-panel">
          <div className="app-viewport">
            {Screen}
          </div>
        </div>
      </div>
    </NavCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

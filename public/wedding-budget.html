<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>신혼생활 가계부 (미리보기) — sinhon.life</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root {
  --sky-50:#f3faff; --sky-100:#e2f1fc; --sky-200:#bfdef5; --sky-300:#8cc3ea;
  --sky-400:#56a5db; --sky-500:#3B8BCF; --sky-600:#2b7bc5; --sky-700:#1b6ba2; --sky-800:#15557f;
  --ink-900:#0d1620; --ink-800:#1a2330; --ink-700:#2f3a47; --ink-600:#51606e;
  --ink-500:#74828f; --ink-400:#99a4af; --ink-300:#bcc4cc; --ink-200:#dde3e9;
  --ink-100:#eff2f6; --ink-50:#f7f9fb; --white:#ffffff;
  --expense:#d65656; --expense-bg:#fbeaea; --warn:#c98a2a; --warn-bg:#faedd4;
}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:#ffffff;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink-900);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}input{font-family:inherit}

/* canvas */
.canvas{display:flex;gap:32px;padding:32px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.artboard{display:flex;flex-direction:column;gap:10px}
.artboard-label{font-size:12px;font-weight:700;color:var(--ink-600);letter-spacing:-0.01em}

/* iPhone frame */
.iphone{width:402px;height:874px;border-radius:56px;background:#0d1620;padding:14px;box-shadow:0 30px 60px -20px rgba(20,40,80,0.30),0 8px 24px -12px rgba(20,40,80,0.18);position:relative}
.iphone-screen{width:100%;height:100%;border-radius:44px;overflow:hidden;background:var(--ink-50);position:relative}

/* mobile app */
.m-app{width:100%;height:100%;display:flex;flex-direction:column;background:#ffffff;position:relative;overflow:hidden}
.m-header{padding:56px 18px 12px;display:flex;align-items:center;justify-content:space-between;background:#ffffff;flex-shrink:0;z-index:10}
.m-header-left{display:flex;align-items:center;gap:10px}
.brand-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--sky-500),var(--sky-700));color:white;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
.m-greeting{font-size:13.5px;font-weight:700;color:var(--ink-900);letter-spacing:-0.02em}
.m-name{font-size:11px;color:var(--sky-700);font-weight:600;margin-top:1px}
.m-header-actions{display:flex;gap:8px}
.m-icon-btn{width:34px;height:34px;border-radius:10px;background:var(--white);border:1px solid var(--ink-100);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--ink-700);position:relative}
.m-icon-btn .dot{position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--expense)}

.m-scroll{flex:1;overflow-y:auto;padding:6px 14px 110px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.m-scroll>*{flex-shrink:0}.m-scroll::-webkit-scrollbar{width:0}

/* Hero — 결혼 비용 누적 */
.cum-hero{background:var(--white);border:1px solid var(--ink-100);border-radius:22px;padding:22px 20px 20px;position:relative;overflow:hidden}
.cum-hero::before{content:'';position:absolute;left:0;top:20px;bottom:20px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,var(--sky-500),var(--sky-700))}
.cum-hero-label{font-size:11px;color:var(--ink-500);font-weight:700;letter-spacing:0.06em;text-transform:uppercase}
.cum-hero-num{margin-top:8px;font-size:36px;font-weight:800;color:var(--ink-900);letter-spacing:-0.04em;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:4px}
.cum-hero-num.surplus{color:var(--sky-600)}
.cum-hero-num .unit{font-size:17px;font-weight:700;color:var(--ink-600)}
.cum-hero-badge{display:inline-flex;align-items:center;gap:4px;margin-top:6px;background:var(--sky-100);color:var(--sky-700);padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700}
.cum-hero-row{margin-top:12px;display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-600);font-variant-numeric:tabular-nums}
.cum-hero-row .dot{display:inline-block;width:6px;height:6px;border-radius:2px;margin-right:5px;vertical-align:middle}
.cum-hero-foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--ink-100);font-size:11px;color:var(--ink-500);display:flex;align-items:center;justify-content:space-between}

/* NL input bar */
.nl-input{display:flex;align-items:center;gap:10px;background:var(--white);border:1.5px solid var(--sky-200);border-radius:16px;padding:12px 14px;box-shadow:0 4px 14px -8px rgba(43,123,197,0.20)}
.nl-input-ic{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--sky-500),var(--sky-700));color:white;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex-shrink:0}
.nl-input input{flex:1;border:none;outline:none;background:transparent;font-size:14px;font-weight:500;color:var(--ink-900);font-family:inherit}
.nl-input input::placeholder{color:var(--ink-400)}
.nl-input-go{background:var(--sky-500);color:white;border:none;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:800;cursor:pointer}
.nl-input-go:disabled{background:var(--ink-200);color:var(--ink-400);cursor:not-allowed}
.nl-hint{margin-top:-2px;padding:0 6px;font-size:10.5px;color:var(--ink-400)}

/* slide-up sheet */
.sheet-backdrop{position:absolute;inset:0;z-index:50;background:rgba(20,40,80,0.20);display:flex;align-items:flex-end}
.sheet{background:var(--white);width:100%;max-height:75%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px 24px;animation:sheetIn 0.22s ease-out}
.sheet::-webkit-scrollbar{width:0}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:36px;height:4px;background:var(--ink-200);border-radius:2px;margin:0 auto 14px}
.sheet-title{font-size:15px;font-weight:800;color:var(--ink-900);letter-spacing:-0.02em;margin-bottom:6px}
.sheet-orig{margin-bottom:14px;padding:10px 12px;background:var(--sky-100);border-radius:10px;font-size:12.5px;color:var(--sky-700);font-weight:600;letter-spacing:-0.01em;display:flex;align-items:center;gap:8px}
.sheet-orig::before{content:'"';opacity:0.6;font-size:18px}
.sheet-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;background:var(--ink-50);border:1px solid var(--ink-100);border-radius:999px;font-size:13px;font-weight:700;color:var(--ink-900);cursor:pointer;transition:all 0.12s}
.chip.active{background:var(--sky-100);border-color:var(--sky-300);color:var(--sky-700)}
.chip-amount{background:linear-gradient(135deg,var(--sky-500),var(--sky-700));border-color:var(--sky-700);color:white;font-size:14.5px;font-weight:800}
.sheet-save{width:100%;padding:14px;background:linear-gradient(135deg,var(--sky-500),var(--sky-700));color:white;border:none;border-radius:14px;font-size:14.5px;font-weight:800;letter-spacing:-0.01em;cursor:pointer}
.picker{margin-top:-8px;margin-bottom:14px;padding:12px;background:var(--ink-50);border-radius:12px}
.picker-label{font-size:10px;color:var(--ink-500);font-weight:700;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:8px}
.picker-row{display:flex;flex-wrap:wrap;gap:6px}
.picker-opt{padding:7px 12px;background:var(--white);border:1px solid var(--ink-100);border-radius:8px;font-size:12px;font-weight:700;color:var(--ink-700);cursor:pointer}
.picker-opt.selected{background:var(--sky-500);color:white;border-color:var(--sky-500)}
.picker-input{width:100%;padding:10px 12px;background:var(--white);border:1px solid var(--ink-100);border-radius:8px;font-size:14px;font-weight:700;color:var(--ink-900);text-align:right;font-variant-numeric:tabular-nums}

/* 축의금 */
.gift{background:var(--white);border:1px solid var(--ink-100);border-radius:18px;padding:16px 16px 4px}
.gift-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.gift-title{font-size:13px;font-weight:700;color:var(--ink-900);letter-spacing:-0.02em}
.gift-toggle{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--ink-50);color:var(--ink-700);border:1px solid var(--ink-100);display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.gift-toggle.on{background:var(--sky-500);color:white;border-color:var(--sky-500)}
.gift-total{font-size:26px;font-weight:800;color:var(--ink-900);letter-spacing:-0.03em;font-variant-numeric:tabular-nums}
.gift-total .unit{font-size:13px;font-weight:700;color:var(--ink-600);margin-left:2px}
.gift-sub{margin-top:3px;font-size:11.5px;color:var(--ink-500);font-weight:600}
.gift-tier-tabs{display:flex;gap:4px;margin-top:12px;margin-bottom:12px;background:var(--ink-50);border-radius:10px;padding:3px}
.gift-tier-tab{flex:1;text-align:center;padding:7px 0;font-size:11px;font-weight:700;color:var(--ink-500);border-radius:7px;cursor:pointer}
.gift-tier-tab.active{background:var(--white);color:var(--sky-700);box-shadow:0 2px 6px -2px rgba(20,40,80,0.10)}
.gift-slider-row{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--ink-500);font-weight:600;margin-bottom:4px}
.gift-slider-row .v{font-size:14px;font-weight:800;color:var(--ink-900);font-variant-numeric:tabular-nums}
.gift-slider{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:var(--ink-200);outline:none;margin-bottom:16px}
.gift-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:var(--sky-500);border:3px solid white;box-shadow:0 2px 6px -1px rgba(43,123,197,0.40);cursor:pointer}
.gift-group-row{display:grid;grid-template-columns:50px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--ink-100)}
.gift-group-row:last-child{border-bottom:none}
.gift-group-name{font-size:13px;font-weight:700;color:var(--ink-900)}
.gift-group-amt{font-size:13.5px;font-weight:800;color:var(--ink-900);font-variant-numeric:tabular-nums}
.gift-group-input{width:56px;padding:4px 6px;background:var(--ink-50);border:1px solid var(--ink-100);border-radius:6px;font-size:11px;font-weight:700;color:var(--ink-900);text-align:right;font-variant-numeric:tabular-nums}
.gift-group-input:focus{outline:none;border-color:var(--sky-400);background:white}
.gift-side-row{margin-top:12px;padding:10px 12px;background:var(--ink-50);border-radius:10px;display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:11px}
.gift-side-cell .k{color:var(--ink-500);font-weight:600;margin-bottom:3px}
.gift-side-cell .v{font-size:14px;font-weight:800;color:var(--ink-900);font-variant-numeric:tabular-nums}
.gift-tier3-empty{padding:16px;background:var(--ink-50);border-radius:10px;text-align:center;font-size:11.5px;color:var(--ink-500);line-height:1.55;margin-bottom:10px}

/* 결산 카드 */
.forecast{background:var(--white);border:1px solid var(--ink-100);border-radius:18px;padding:16px}
.forecast-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.forecast-title{font-size:13px;font-weight:700;color:var(--ink-900);letter-spacing:-0.02em}
.forecast-num{font-size:26px;font-weight:800;color:var(--ink-800);letter-spacing:-0.03em;font-variant-numeric:tabular-nums}
.forecast-num.surplus{color:var(--sky-600)}
.forecast-num .lbl-after{margin-left:6px;font-size:12px;font-weight:700;color:var(--ink-500);letter-spacing:0;vertical-align:middle}
.forecast-sub{margin-top:6px;font-size:11.5px;color:var(--ink-600);line-height:1.6;font-variant-numeric:tabular-nums}

/* Category */
.catx{background:var(--white);border:1px solid var(--ink-100);border-radius:18px;padding:18px 16px 8px}
.catx-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.catx-title{font-size:14.5px;font-weight:800;color:var(--ink-900);letter-spacing:-0.02em}
.catx-total{font-size:11.5px;color:var(--ink-400);font-weight:600}
.catx-stack{display:flex;height:6px;border-radius:999px;overflow:hidden;background:var(--ink-100);margin-bottom:14px}
.catx-row{display:grid;grid-template-columns:32px 1fr auto;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ink-100)}
.catx-row:last-child{border-bottom:none}
.catx-row.empty{opacity:0.55}
.catx-ic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px}
.catx-name{font-size:13.5px;font-weight:700;color:var(--ink-900);letter-spacing:-0.01em}
.catx-avg{font-size:10.5px;color:var(--ink-400);font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums}
.catx-amt{font-size:14px;font-weight:800;color:var(--ink-900);font-variant-numeric:tabular-nums;text-align:right}
.catx-amt.zero{color:var(--ink-300);font-weight:600;font-size:12px}
.catx-divider{font-size:10px;color:var(--ink-400);font-weight:600;letter-spacing:0.04em;text-transform:uppercase;padding:12px 0 6px;text-align:center;border-top:1px dashed var(--ink-200);margin-top:4px}

/* tabbar */
.m-tabbar{position:absolute;left:12px;right:12px;bottom:16px;background:var(--white);border-radius:22px;padding:10px 6px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;box-shadow:0 18px 40px -14px rgba(20,40,80,0.22),0 2px 6px rgba(20,40,80,0.05);z-index:30}
.m-tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9.5px;font-weight:700;color:var(--ink-400);padding:4px 0}
.m-tab .tic{font-size:17px}
.m-tab.active{color:var(--sky-600)}
.m-fab-tab{background:linear-gradient(135deg,var(--sky-500),var(--sky-700));width:46px;height:46px;border-radius:14px;margin:0 auto;display:flex;align-items:center;justify-content:center;color:white;font-size:22px;font-weight:300;box-shadow:0 8px 20px -8px rgba(43,123,197,0.55)}

/* B screen — 목표 가이드 */
.m-tier-tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--ink-50);border-radius:11px;padding:3px;gap:3px;margin-bottom:14px}
.m-tier-tab{padding:8px 0;text-align:center;font-size:11.5px;font-weight:700;color:var(--ink-500);border-radius:8px;letter-spacing:-0.01em;cursor:pointer}
.m-tier-tab.active{background:var(--white);color:var(--sky-700);box-shadow:0 2px 6px -2px rgba(20,40,80,0.10)}
.goal-hero{background:var(--white);border:1px solid var(--ink-100);border-radius:18px;padding:14px}
.tier-hero-row{display:flex;gap:12px;padding:12px 14px;background:var(--ink-50);border-radius:14px;position:relative}
.tier-hero-row::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--sky-500)}
.tier-hero-ic{width:38px;height:38px;border-radius:11px;background:var(--white);border:1px solid var(--ink-200);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.tier-hero-title{font-size:13px;font-weight:800;color:var(--ink-900);display:flex;align-items:center;gap:6px;letter-spacing:-0.01em}
.tier-badge{background:var(--sky-100);color:var(--sky-700);padding:2px 6px;border-radius:5px;font-size:9.5px;font-weight:700}
.tier-hero-desc{font-size:11px;color:var(--ink-600);line-height:1.45;margin-top:2px}
.tier-hero-venue{font-size:10.5px;color:var(--sky-700);font-weight:600;margin-top:4px}
.save-plan{background:var(--white);border:1px solid var(--ink-100);border-radius:14px;display:grid;grid-template-columns:1fr 1fr 1fr;padding:12px;margin-top:12px}
.save-plan .cell{display:flex;flex-direction:column;gap:3px}
.save-plan .cell+.cell{border-left:1px solid var(--ink-100);padding-left:10px}
.save-plan .cell:not(:last-child){padding-right:10px}
.save-plan .k{font-size:9.5px;color:var(--ink-500);font-weight:700;letter-spacing:0.04em;text-transform:uppercase}
.save-plan .v{font-size:15px;font-weight:800;color:var(--ink-900);letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
.save-plan .v .u{font-size:10px;color:var(--ink-500);font-weight:600;margin-left:2px}
.save-plan .v.hl{color:var(--sky-600)}
.advice{background:var(--white);border:1px solid var(--ink-100);border-radius:18px;padding:14px}
.advice-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.advice-ic{width:28px;height:28px;border-radius:9px;background:var(--sky-500);color:white;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.advice-title{font-size:13px;font-weight:800;color:var(--ink-900);letter-spacing:-0.01em}
.advice-item{display:flex;gap:10px;padding:10px 12px;background:var(--ink-50);border-radius:11px;margin-bottom:6px}
.advice-item:last-child{margin-bottom:0}
.advice-num{width:20px;height:20px;border-radius:7px;background:var(--sky-100);color:var(--sky-700);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.advice-text{font-size:12px;color:var(--ink-800);line-height:1.55;letter-spacing:-0.01em}
.advice-text b{color:var(--sky-700);font-weight:700}
.alloc-row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ink-100)}
.alloc-row:last-child{border-bottom:none}
.alloc-ic{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px}
.alloc-name{font-size:12px;font-weight:600;color:var(--ink-900)}
.alloc-pct{font-size:10.5px;color:var(--ink-500);font-weight:700;font-variant-numeric:tabular-nums}
.alloc-bar{height:4px;border-radius:2px;background:var(--ink-100);overflow:hidden}
.alloc-bar>span{display:block;height:100%;border-radius:2px}
.alloc-amt{font-size:11.5px;font-weight:700;color:var(--ink-900);font-variant-numeric:tabular-nums}
.m-setting{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--ink-100)}
.m-setting:last-child{border-bottom:none}
.m-setting .k{font-size:12.5px;color:var(--ink-700);font-weight:600}
.m-setting input{width:130px;padding:7px 10px;background:var(--ink-50);border:1px solid var(--ink-100);border-radius:9px;font-size:13px;font-weight:700;color:var(--ink-900);text-align:right;font-variant-numeric:tabular-nums}
.m-setting input:focus{outline:none;border-color:var(--sky-400);background:white}
.m-setting .suffix{display:flex;align-items:center;gap:4px}
.m-setting .suffix>span{font-size:11.5px;color:var(--ink-500);font-weight:600}
.m-card{background:var(--white);border-radius:18px;padding:16px 16px 14px;border:1px solid var(--ink-100)}
.m-card-title{font-size:13px;font-weight:700;color:var(--ink-900);letter-spacing:-0.02em;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.m-card-title .link{font-size:11.5px;color:var(--ink-400);font-weight:600}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

<script type="text/babel" data-presets="env,react">
const fmtKRW=(n)=>Math.abs(Math.round(n)).toLocaleString("ko-KR");
const fmt만=(n)=>{const v=Math.round(n/10000);return v.toLocaleString("ko-KR")+"만"};
const AVG={venue:15_000_000,studio:3_600_000,hanbok:1_500_000,gift:3_000_000,appliance:4_000_000,newhome:null,travel:5_000_000,cash:1_000_000,etc:1_000_000};

const BASE_WEDDING = {
  weddingDate:"2026-10-31",weddingDateLabel:"2026년 10월 31일 (토)",dDay:163,
  gifts:{tier:1,tier1:{headcount:150,avgAmount:80_000},
    tier2:{친구:{count:60,avg:80_000},직장:{count:50,avg:50_000},가족:{count:40,avg:100_000}},
    sideSplit:false,sideBreakdown:{신랑:0.42,신부:0.58},actual:0},

function parseNL(text) {
  // 금액 파싱
  let amount = 0;
  const eok = text.match(/(\d+\.?\d*)\s*억/);
  const man = text.match(/(\d+\.?\d*)\s*만(?:원)?/);
  const won = text.match(/(\d[\d,]{2,})\s*원?/);
  if (eok) amount += parseFloat(eok[1]) * 100_000_000;
  if (man) amount += parseFloat(man[1]) * 10_000;
  if (!eok && !man && won) amount = parseInt(won[1].replace(/,/g,""));

  // 카테고리 파싱
  let category = "etc";
  let confidence = 0.5;
  for (const [cat, kws] of Object.entries(CATEGORY_KEYWORDS)) {
    for (const kw of kws) {
      if (text.includes(kw)) { category = cat; confidence = 0.95; break; }
    }
    if (confidence === 0.95) break;
  }

  // 날짜 파싱
  let date = "오늘";
  if (text.includes("어제")) date = "어제";
  else if (text.includes("그제")) date = "그제";
  const md = text.match(/(\d{1,2})\/(\d{1,2})/);
  if (md) date = `${md[1]}/${md[2]}`;

  // 결제수단
  let method = "카드";
  if (text.includes("현금")) method = "현금";
  else if (text.includes("이체") || text.includes("계좌")) method = "이체";

  // 제목 (간단 추출 — 카테고리 키워드 빼고 남은 첫 단어)
  const title = text.replace(/\d[\d,.]*[만원억]+/g,"").replace(/오늘|어제|그제/g,"").replace(/카드|현금|이체|계좌/g,"").trim().slice(0, 30) || CATEGORY_LABELS[category];

  return { amount, category, date, method, title, confidence };
}

      {sorted.map(c => {

          <div key={c.id} className="catx-row">

                {avg && c.spent < avg * 0.6 && c.spent > 0 && <span style={{color:"var(--sky-600)",marginLeft:4}}> · 평균 대비 −{Math.round((1-c.spent/avg)*100)}%</span>}

          </div>
        );
      })}
      {empty.length > 0 && (
        <>
          <div className="catx-divider">아직 안 쓴 카테고리</div>
          {empty.map(c => {
            const avg = AVG[c.id];

              <div key={c.id} className="catx-row empty">

        </>
      )}
    </div>
  );
}

// A — 메인 트래커
function ScreenBasic() {
  const D = WEDDING;
  const [categories, setCategories] = React.useState(D.categories);
  const [gifts, setGifts] = React.useState(D.gifts);
  const [recentExpenses, setRecentExpenses] = React.useState(D.recentExpenses);
  const [parsedDraft, setParsedDraft] = React.useState(null);

  const totalSpent = categories.reduce((s, c) => s + c.spent, 0);
  const plannedTotal = categories.reduce((s, c) => s + c.planned, 0);
  const tier1Total = gifts.tier1.headcount * gifts.tier1.avgAmount;
  const tier2Total = Object.values(gifts.tier2).reduce((s, g) => s + g.count * g.avg, 0);
  const expectedGifts = gifts.tier === 1 ? tier1Total : gifts.tier === 2 ? tier2Total : gifts.actual;

  const onSaveExpense = (data) => {
    // 카테고리 spent 업데이트 + 최근 지출에 prepend
    setCategories(categories.map(c => c.id === data.category ? {...c, spent: c.spent + data.amount} : c));
    const cat = categories.find(c => c.id === data.category);
    setRecentExpenses([
      { id: Date.now(), title: data.title || cat.name, sub: `${data.date} · ${cat.name}`, amt: data.amount, icon: cat.icon, color: cat.color },
      ...recentExpenses
    ].slice(0, 8));
    setParsedDraft(null);
  };

  return (
    <div className="m-app">
      <Header dDay={D.dDay} />
      <div className="m-scroll">
        <CumulativeHero spent={totalSpent} gifts={0} dDay={D.dDay} />
        <NLInput onParsed={setParsedDraft} />
        <GiftTracker gifts={gifts} setGifts={setGifts} />
        <ForecastCard spent={totalSpent} plannedTotal={plannedTotal} expectedGifts={expectedGifts} />
        <CategoryX categories={categories} />

        <div className="m-card">
          <div className="m-card-title">최근 지출<span className="link">전체 →</span></div>
          {recentExpenses.map(t => (
            <div key={t.id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 0",borderBottom:"1px solid var(--ink-100)"}}>
              <div style={{width:34,height:34,borderRadius:11,background:t.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15}}>{t.icon}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:600,color:"var(--ink-900)"}}>{t.title}</div>
                <div style={{fontSize:10.5,color:"var(--ink-400)",marginTop:1}}>{t.sub}</div>
              </div>
              <div style={{fontSize:13,fontWeight:700,color:"var(--ink-900)",fontVariantNumeric:"tabular-nums"}}>−{fmt만(t.amt)}원</div>
            </div>
          ))}
        </div>
      </div>
      <Tabbar active="home" />
      {parsedDraft && <ParseSheet parsed={parsedDraft} onClose={() => setParsedDraft(null)} onSave={onSaveExpense} />}
    </div>
  );
}

// B — 목표 가이드
function ScreenGoal() {
  const D = WEDDING;
  const [tierId, setTierId] = React.useState("30m");
  const [saved] = React.useState(D.saved);
  const tier = PRESETS.find(t => t.id === tierId);
  const target = tier.amt;
  const monthlyCapacity = Math.max(0, D.monthlyIncome - D.monthlyFixedExpense - 800_000);
  const need = Math.max(0, target - saved);
  const monthlyNeed = D.monthsLeft > 0 ? Math.ceil(need / D.monthsLeft) : need;
  const gap = monthlyNeed - monthlyCapacity;
  const feasible = gap <= 0;
  return (
    <div className="m-app">
      <Header dDay={D.dDay} />
      <div className="m-scroll">
        <div className="goal-hero">
          <div className="m-tier-tabs">
            {PRESETS.map(t => (
              <div key={t.id} className={`m-tier-tab ${tierId === t.id ? "active" : ""}`} onClick={() => setTierId(t.id)}>{t.label}</div>
            ))}
          </div>
          <div className="tier-hero-row">
            <div className="tier-hero-ic">💍</div>
            <div style={{flex:1}}>
              <div className="tier-hero-title">{tier.tier}<span className="tier-badge">추천</span></div>
              <div className="tier-hero-desc">{tier.desc}</div>
              <div className="tier-hero-venue">📍 {tier.venueGuide}</div>
            </div>
          </div>
          <div className="save-plan">
            <div className="cell"><div className="k">잔여</div><div className="v">{fmt만(need)}<span className="u">원</span></div></div>
            <div className="cell"><div className="k">월 저축</div><div className="v hl">{fmt만(monthlyNeed)}<span className="u">원</span></div></div>
            <div className="cell"><div className="k">{feasible?"월 여유":"월 부족"}</div><div className="v" style={{color:feasible?"var(--sky-600)":"var(--expense)"}}>{fmt만(Math.abs(gap))}<span className="u">원</span></div></div>
          </div>
        </div>
        <div className="advice">
          <div className="advice-head">
            <div className="advice-ic">✦</div>
            <div className="advice-title">{tier.tier} 맞춤 가이드</div>
          </div>
          {tier.tips.map((t, i) => (
            <div key={i} className="advice-item">
              <div className="advice-num">{i+1}</div>
              <div className="advice-text" dangerouslySetInnerHTML={{__html: t.replace(/(\d[\d,]*만원?)/g,'<b>$1</b>')}} />
            </div>
          ))}
        </div>
        <div className="m-card">
          <div className="m-card-title">{fmt만(target)}원 추천 분배<span className="tier-badge">{tier.tier}</span></div>
          {D.categories.map(c => {
            const ratio = tier.breakdown[c.id] || 0;
            const amt = Math.round(target * ratio);
            const pct = Math.round(ratio * 100);
            return (
              <div key={c.id} className="alloc-row">
                <div className="alloc-ic" style={{background: c.color}}>{c.icon}</div>
                <div style={{minWidth:0}}>
                  <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",marginBottom:3}}>
                    <span className="alloc-name">{c.name}</span>
                    <span className="alloc-pct">{pct}%</span>
                  </div>
                  <div className="alloc-bar"><span style={{width:`${pct}%`,background:"var(--sky-500)"}} /></div>
                </div>
                <div className="alloc-amt">{fmt만(amt)}원</div>
              </div>
            );
          })}
        </div>
      </div>
      <Tabbar active="budget" />
    </div>
  );
}

function Phone({ children }) {
  return (
    <div className="iphone">
      <div className="iphone-screen">{children}</div>
    </div>
  );
}

const isEmbed = new URLSearchParams(location.search).get("embed") === "1";

function EmbedShell({ children }) {
  // sinhon.life 가계부 탭 안에 iframe으로 박힐 때 — iPhone 프레임/캔버스 제거, 자체 Tabbar 숨김
  React.useEffect(() => {
    const style = document.createElement("style");
    style.textContent = `body{background:#fff} .m-tabbar{display:none!important} .m-scroll{padding-bottom:32px!important} .m-header{padding-top:18px!important}`;
    document.head.appendChild(style);
  }, []);
  return <div style={{ width: "100%", height: "100vh", background: "#ffffff" }}>{children}</div>;
}

function App() {
  if (isEmbed) {
    return <EmbedShell><ScreenBasic /></EmbedShell>;
  }
  return (
    <div className="canvas">
      <div className="artboard">
        <div className="artboard-label">A · 누적 비용 트래커 (자연어 입력)</div>
        <Phone><ScreenBasic /></Phone>
      </div>
      <div className="artboard">
        <div className="artboard-label">B · 목표 가이드 (1천만 ~ 1억)</div>
        <Phone><ScreenGoal /></Phone>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

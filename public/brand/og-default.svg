<?xml version="1.0" encoding="UTF-8"?>
<!-- Open Graph default card — 1200×630. Convert to PNG via headless Chrome / sharp when needed. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF8F1"/>
      <stop offset="1" stop-color="#FEE5D5"/>
    </linearGradient>
    <linearGradient id="hearth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBA38B"/>
      <stop offset="1" stop-color="#F97066"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative arcs -->
  <circle cx="1050" cy="120" r="220" fill="#F97066" opacity="0.08"/>
  <circle cx="120" cy="520" r="180" fill="#5EC9A8" opacity="0.08"/>

  <!-- Hearth mark -->
  <g transform="translate(96,128)">
    <path d="M60 0 C22 0 0 34 0 64 C0 98 32 122 60 122 C88 122 120 98 120 64 C120 34 98 0 60 0 Z"
          fill="url(#hearth)"/>
    <path d="M60 22 C38 22 22 46 22 64 C22 82 40 98 60 98 C80 98 98 82 98 64 C98 46 82 22 60 22 Z"
          fill="#FDF8F1"/>
    <circle cx="60" cy="64" r="12" fill="#F97066"/>
  </g>

  <!-- Tagline: Korean headline -->
  <text x="96" y="360"
        font-family="'Fraunces', 'Noto Serif KR', 'Apple SD Gothic Neo', serif"
        font-size="84"
        font-weight="600"
        fill="#1E2A3A"
        letter-spacing="-2">신혼, 지금부터의 생활</text>
  <text x="96" y="440"
        font-family="'Pretendard', 'Apple SD Gothic Neo', sans-serif"
        font-size="32"
        fill="#4A5566">
    신혼부부 · 신랑 · 신부가 꼭 챙겨야 할 2026 정책을 AI가 맞춤 안내
  </text>

  <!-- URL badge -->
  <rect x="96" y="510" width="220" height="48" rx="24" fill="#1E2A3A"/>
  <text x="206" y="542" text-anchor="middle"
        font-family="'JetBrains Mono', ui-monospace, monospace"
        font-size="20"
        letter-spacing="2"
        fill="#FDF8F1">SINHON.LIFE</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!-- 신혼생활 wordmark — horizontal, serif display + mark -->
<svg xmlns="http://www.w3.org/2000/svg" width="280" height="64" viewBox="0 0 280 64" role="img" aria-label="신혼생활">
  <title>신혼생활</title>
  <!-- Hearth mark: arc + spark -->
  <g transform="translate(8,8)">
    <path d="M24 6 C10 6 4 18 4 28 C4 40 16 46 24 46 C32 46 44 40 44 28 C44 18 38 6 24 6 Z"
          fill="#F97066"/>
    <path d="M24 14 C16 14 12 22 12 28 C12 34 18 38 24 38 C30 38 36 34 36 28 C36 22 32 14 24 14 Z"
          fill="#FDF8F1"/>
    <circle cx="24" cy="28" r="4" fill="#F97066"/>
  </g>
  <!-- Wordmark text (Korean) — fall back to system serif when Fraunces unavailable -->
  <text x="68" y="42"
        font-family="'Fraunces', 'Noto Serif KR', 'Apple SD Gothic Neo', serif"
        font-size="28"
        font-weight="600"
        fill="#1E2A3A"
        letter-spacing="-0.5">신혼생활</text>
</svg>

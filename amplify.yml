version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g pnpm@11.5.1
            - REPO_DIR="$(find "$CODEBUILD_SRC_DIR" -maxdepth 3 -name pnpm-workspace.yaml -print -quit | xargs dirname)" && cd "$REPO_DIR" && pnpm install --frozen-lockfile
        build:
          commands:
            - REPO_DIR="$(find "$CODEBUILD_SRC_DIR" -maxdepth 3 -name pnpm-workspace.yaml -print -quit | xargs dirname)" && cd "$REPO_DIR" && npm --prefix apps/web run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - ../../node_modules/**/*
          - ../../apps/web/.next/cache/**/*

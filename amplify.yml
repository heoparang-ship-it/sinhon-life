version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | grep -E '^(ANTHROPIC_API_KEY|PINECONE_API_KEY|NEXT_PUBLIC_|KAKAO_|NEXTAUTH_|DATABASE_URL|DIRECT_URL)' >> .env.production
        - npx prisma generate
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
